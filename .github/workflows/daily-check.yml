name: Vérification quotidienne

on:
  schedule:
    # Minuit 5 à Paris : 22:05 UTC en été, 23:05 UTC en hiver.
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
    # Rattrapage le matin si GitHub a sauté une exécution.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = vérification habituelle, test-notifications = envoie un message de test aux deux"
        type: choice
        options:
          - normal
          - test-notifications
        default: normal

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les lectures et envoyer les challenges
        run: python scripts/daily_check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          SITE_URL: ${{ vars.SITE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_P1: ${{ secrets.PHONE_P1 }}
          CALLMEBOT_KEY_P1: ${{ secrets.CALLMEBOT_KEY_P1 }}
          EMAIL_P1: ${{ secrets.EMAIL_P1 }}
          PHONE_P2: ${{ secrets.PHONE_P2 }}
          CALLMEBOT_KEY_P2: ${{ secrets.CALLMEBOT_KEY_P2 }}
          EMAIL_P2: ${{ secrets.EMAIL_P2 }}
